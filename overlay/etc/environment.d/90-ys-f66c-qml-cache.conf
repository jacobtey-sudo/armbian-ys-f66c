# Qt 6.8.2 (Debian trixie) can crash KWin/plasmashell/Discover while loading
# a corrupted QML disk-cache file in QV4::CompiledData::CompilationUnit::
# loadFromDisk(). The cache is only a startup optimization; disable it until
# Debian ships a fixed Qt. On this hardware: KWin Wayland and
# X11 plus plasmashell stay up without new core dumps.
QML_DISABLE_DISK_CACHE=1
